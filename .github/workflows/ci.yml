name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    env:
      AURASCAN_AI_ENABLED: "0"
      AURASCAN_INSTRUCTION_AI_ENABLED: "0"
      AURASCAN_INCIDENT_AI_ENABLED: "0"
      AURASCAN_RECOVERY_AI_ENABLED: "0"
      AURASCAN_RELEASE_FINAL: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
      AURASCAN_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall aurascan tests tools

      - name: Run test suite
        run: python -m pytest -q

      - name: Audit presenter coverage
        run: python tools/audit_presenter_coverage.py --strict

      - name: Audit MEDIUM-or-higher presenter coverage
        run: python tools/audit_presenter_coverage.py --strict-medium

      - name: Audit architecture invariants
        run: python tools/architecture_audit.py --strict

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Type-check the desktop renderer
        run: npm --prefix desktop run typecheck

      - name: Test the desktop renderer
        run: npm --prefix desktop test

      - name: Build the desktop renderer
        run: npm --prefix desktop run build
